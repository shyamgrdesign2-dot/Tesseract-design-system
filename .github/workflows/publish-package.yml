name: Publish to GitHub Packages

# Publishes @dhspl-tatvacare/tesseract-ui to the org's PRIVATE GitHub Packages npm
# registry. Consumers install with a one-time .npmrc + a read:packages token (see the
# developer guide). Publish auth uses the repo's built-in GITHUB_TOKEN (packages:write)
# — no PAT needed on the publishing side.
#
# Triggers: on a published GitHub Release (normal path), or manual workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@dhspl-tatvacare"

      - run: npm ci

      - name: Install MCP deps (needed by preflight)
        run: npm --prefix mcp ci || npm --prefix mcp install

      - name: Preflight — never publish a broken build
        run: npm run preflight

      - name: Build library (ESM + CJS + CSS + types)
        run: npm run build:lib

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
